[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-accident"
version = "0.1.0"
description = "Unified ship accident ML pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
reports = [
  "pypdf>=4.0",
  "python-docx>=1.0",
]

[project.scripts]
ship-accident-train = "ship_accident.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
