target_column: accident level

drop_always:
  - fatality
  - 损伤位置
  - 损伤种类

drop_for_target:
  - Cause of Accident
  - 事发水域路况

mode: tabular_only

text_columns: []

tfidf_max_features: 1000

test_size: 0.3
random_state: 42
stratify: true
