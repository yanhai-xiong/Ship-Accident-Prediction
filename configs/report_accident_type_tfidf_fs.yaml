# Same as report_accident_type_tfidf.yaml but with SelectFromModel inside CV.
target_column: accident type

drop_always:
  - path
  - title_type_raw
  - file_id
  - accident severity
  - severity_label_source
  - severity_match_raw
  - num_direct_loss_wan
  - num_deaths_reported
  - num_missing_reported
  - flag_injury_mentioned
  - post_outcome_keyword_hits

drop_for_target: []

mode: tabular_tfidf

text_columns:
  - full_text

tfidf_max_features: 800

test_size: 0.3
random_state: 42
stratify: true
drop_na: true
min_class_counts: 6

grid_search_cv: 5
scoring: accuracy
n_jobs: 1

feature_selection:
  enabled: true
  estimator: random_forest
  n_estimators: 200
  n_jobs: 1
  threshold: median
  # sklearn SelectFromModel only supports string "mean"/"median" or a float scale factor (see docs)
  threshold_grid:
    - median
    - mean

model_names:
  - random_forest
  - gradient_boosting
